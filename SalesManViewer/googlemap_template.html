<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <style type="text/css">
            html, body { height: 100%; margin: 0; padding: 0; }
            #gmap { height: 100%; }
            .marker-bubble {
                font-family: "Segoe UI", Arial, sans-serif;
                font-size: 12px;
                line-height: 1.4;
                min-width: 140px;
            }
            .marker-bubble .mb-name {
                font-weight: 600;
                color: #212529;
            }
            .marker-bubble .mb-time {
                color: #6c757d;
                margin-top: 2px;
            }
        </style>
        <script type="text/javascript" src="http://maps.google.com/maps/api/js?sensor=false"></script>
        <script type="text/javascript">

            function escapeHtml(s) {
                return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
                });
            }

            function buildBubble(title, when) {
                var html = '<div class="marker-bubble">';
                html += '<div class="mb-name">' + escapeHtml(title || 'Unknown') + '</div>';
                if (when) {
                    html += '<div class="mb-time">' + escapeHtml(when) + '</div>';
                }
                html += '</div>';
                return html;
            }

            function initialize() {
                window.markers = new Array();
                window.marker_data = [[MARKER_DATA]];
                var defaultCenter = new google.maps.LatLng(-0.0236, 37.9062);
                window.gmap = new google.maps.Map(document.getElementById('gmap'), {
                    zoom: 6,
                    center: defaultCenter,
                    mapTypeId: google.maps.MapTypeId.ROADMAP
                });
                window.infowindow = new google.maps.InfoWindow();
                if (!marker_data || marker_data.length === 0 || marker_data[0].length < 2) {
                    return; // stay centred on Kenya
                }
                renderMarkers(marker_data, false);
            }

            function updateMarkers(marker_data) {
                // clear existing
                for (var i = 0; i < markers.length; i++) markers[i].setMap(null);
                markers = [];
                renderMarkers(marker_data, true);
            }

            function renderMarkers(data, fitAfter) {
                var bounds = new google.maps.LatLngBounds();
                for (var i = 0; i < data.length; i++) {
                    var lat = data[i][0];
                    var lng = data[i][1];
                    var title = data[i][2];
                    var icon = data[i][3];
                    var when = data[i][4] || '';
                    var position = new google.maps.LatLng(lat, lng);
                    var marker = new google.maps.Marker({
                        position: position,
                        map: gmap,
                        title: title,
                        icon: icon
                    });
                    bounds.extend(position);
                    (function (marker, title, when) {
                        google.maps.event.addListener(marker, 'click', function () {
                            infowindow.setContent(buildBubble(title, when));
                            infowindow.open(gmap, marker);
                            gmap.setZoom(16);
                            gmap.panTo(marker.getPosition());
                            // Optional VB bridge (kept from original)
                            try {
                                window.chrome.webview.hostObjects.bridge.getMarkerDataFromJavascript(title, marker.getPosition().lat(), marker.getPosition().lng());
                            } catch (e) { /* ignore when bridge not ready */ }
                        });
                    })(marker, title, when);
                    markers.push(marker);
                }
                if (data.length === 1) {
                    gmap.setCenter(bounds.getCenter());
                    gmap.setZoom(16);
                } else if (data.length > 1) {
                    gmap.fitBounds(bounds);
                }
            }
            google.maps.event.addDomListener(window, 'load', initialize);
        </script>
    </head>
    <body>
        <div id="gmap"></div>
    </body>
</html>
