<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <style type="text/css">
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        #gmap {
            height: 100%;
        }
        .marker-bubble {
            font-family: "Segoe UI", Arial, sans-serif;
            font-size: 12px;
            line-height: 1.4;
            min-width: 140px;
        }
        .marker-bubble .mb-name {
            font-weight: 600;
            color: #212529;
        }
        .marker-bubble .mb-time {
            color: #6c757d;
            margin-top: 2px;
        }
    </style>
    <script
        type="text/javascript"
        src="http://maps.google.com/maps/api/js?sensor=false">
    </script>
    <script type="text/javascript">
           // GLOBAL MAP OBJECTS
        window.markers = [];
        window.routeMarkers = [];
        window.routePolyline = null;
        window.marker_data = [];
        window.gmap = null;
        window.infowindow = null;

        // HTML HELPERS        
        function escapeHtml(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                }[c];
            });
        }

        function buildBubble(title, when) {
            var html = '<div class="marker-bubble">';
            html += '<div class="mb-name">' +
                escapeHtml(title || 'Unknown') +
                '</div>';
            if (when) {
                html += '<div class="mb-time">' +
                    escapeHtml(when) +
                    '</div>';
            }
            html += '</div>';
            return html;
        }

        // MAP INITIALIZATION       
        function initialize() {
            window.marker_data = [[MARKER_DATA]];
            var defaultCenter = new google.maps.LatLng(-0.0236, 37.9062);
            window.gmap = new google.maps.Map(document.getElementById('gmap'), {
                    zoom: 6,
                    center: defaultCenter,
                    mapTypeId: google.maps.MapTypeId.ROADMAP
                });
            window.infowindow = new google.maps.InfoWindow();
            if (!window.marker_data || window.marker_data.length === 0 ||
                window.marker_data[0].length < 2) {
                return;
            }
            renderMarkers(window.marker_data, false);
        }

        // MARKER MANAGEMENT     
        function clearMarkers() {
            for (var i = 0; i < window.markers.length; i++) {
                window.markers[i].setMap(null);
            }
            window.markers = [];
        }

        function updateMarkers(marker_data) {
            clearRoute();
            clearMarkers();
            renderMarkers(marker_data || [], true);
        }

        function renderMarkers(data, fitAfter) {
            data = data || [];
            var bounds = new google.maps.LatLngBounds();
            for (var i = 0; i < data.length; i++) {
                var lat = Number(data[i][0]);
                var lng = Number(data[i][1]);
                if (!isFinite(lat) || !isFinite(lng)) {
                    continue;
                }
                if (lat < -90 || lat > 90 ||
                    lng < -180 || lng > 180) {
                    continue;
                }
                var title = data[i][2] || 'Unknown';
                var icon = data[i][3];
                var when = data[i][4] || '';
                var position = new google.maps.LatLng(lat, lng);
                var markerOptions = {
                    position: position,
                    map: window.gmap,
                    title: title
                };
                if (icon) {
                    markerOptions.icon = icon;
                }
                var marker = new google.maps.Marker(markerOptions);
                bounds.extend(position);
                (function (marker, title, when) {
                    google.maps.event.addListener(marker, 'click', function () {
                            window.infowindow.setContent(buildBubble(title, when));
                            window.infowindow.open(window.gmap, marker);
                            window.gmap.setZoom(16);
                            window.gmap.panTo(marker.getPosition());
                            // Existing VB.NET bridge.
                            try {
                                window.chrome.webview.hostObjects.bridge
                                    .getMarkerDataFromJavascript(title, marker.getPosition().lat(), marker.getPosition().lng());
                            } catch (e) {
                                // Bridge may not be available.
                            }
                        });
                })(marker, title, when);
                window.markers.push(marker);
            }
            if (!fitAfter || window.markers.length === 0) {
                return;
            }
            if (window.markers.length === 1) {
                window.gmap.setCenter(window.markers[0].getPosition());
                window.gmap.setZoom(16);
            } else {
                window.gmap.fitBounds(bounds);
            }
        }

        // ROUTE MANAGEMENT
        function clearRoute() {
            // Remove the previous route line.
            if (window.routePolyline) {
                window.routePolyline.setMap(null);
                window.routePolyline = null;
            }
            // Remove route-specific markers.
            for (var i = 0; i < window.routeMarkers.length; i++) {
                window.routeMarkers[i].setMap(null);
            }
            window.routeMarkers = [];
            // Close any open information window.
            if (window.infowindow) {
                window.infowindow.close();
            }
        }

        // ROUTE RENDERING
        function drawRoute(data, salesmanName) {
            if (!window.gmap) {
                return;
            }
            clearRoute();
            clearMarkers();
            data = data || [];
            if (data.length === 0) {
                return;
            }
            var routePath = [];
            var routeBounds = new google.maps.LatLngBounds();
            var validPoints = [];            
            // Validate and prepare route coordinates.
            for (var i = 0; i < data.length; i++) {
                var lat = Number(data[i][0]);
                var lng = Number(data[i][1]);
                if (!isFinite(lat) || !isFinite(lng)) {
                    continue;
                }
                if (lat < -90 || lat > 90 || lng < -180 || lng > 180) {
                    continue;
                }
                if (lat === 0 && lng === 0) {
                    continue;
                }
                var position = new google.maps.LatLng(lat, lng);
                routePath.push(position);
                routeBounds.extend(position);
                validPoints.push({
                    position: position,
                    title: data[i][2] || salesmanName || 'Unknown',
                    icon: data[i][3],
                    when: data[i][4] || ''
                });
            }
            if (validPoints.length === 0) {
                return;
            }
            // Draw route line.           
            if (routePath.length >= 2) {
                window.routePolyline = new google.maps.Polyline({
                    path: routePath,
                    geodesic: true,
                    strokeColor: '#1976D2',
                    strokeOpacity: 0.9,
                    strokeWeight: 5,
                    map: window.gmap,
                    clickable: false
                });
            }
            // ---------------------------------------------
            for (var j = 0; j < validPoints.length; j++) {
                var point = validPoints[j];
                var markerTitle = point.title;
                var markerWhen = point.when;
                var markerIcon = point.icon;
                var markerOptions = {
                    position: point.position,
                    map: window.gmap,
                    title: markerTitle
                };
                // Use the configured icon for intermediate points.
                if (markerIcon) {
                    markerOptions.icon = markerIcon;
                }
                // First and last points get dedicated markers.
                if (j === 0) {
                    markerOptions.label = {
                        text: 'S',
                        color: '#FFFFFF',
                        fontWeight: 'bold'
                    };
                    markerOptions.icon = undefined;
                } else if (j === validPoints.length - 1) {
                    markerOptions.label = {
                        text: 'E',
                        color: '#FFFFFF',
                        fontWeight: 'bold'
                    };
                    markerOptions.icon = undefined;
                }
                var marker = new google.maps.Marker(markerOptions);
                // Use colored circular markers for start/end.
                if (j === 0 || j === validPoints.length - 1) {
                    marker.setIcon({
                        path: google.maps.SymbolPath.CIRCLE,
                        scale: 9,
                        fillColor: j === 0 ? '#198754' : '#DC3545',
                        fillOpacity: 1,
                        strokeColor: '#FFFFFF',
                        strokeWeight: 2
                    });
                    marker.setLabel({
                        text: j === 0 ? 'S' : 'E',
                        color: '#FFFFFF',
                        fontWeight: 'bold',
                        fontSize: '10px' 
                    });
                }

                (function (marker, title, when) {
                    google.maps.event.addListener(marker, 'click', function () {
                            window.infowindow.setContent(buildBubble(title, when));
                            window.infowindow.open(window.gmap, marker);
                            window.gmap.panTo(marker.getPosition());
                            // Keep the existing bridge behavior.
                            try {
                                window.chrome.webview.hostObjects.bridge.getMarkerDataFromJavascript(title, marker.getPosition().lat(), marker.getPosition().lng());
                            } catch (e) {
                                // Bridge may not be available.
                            }
                        });
                })(marker, markerTitle, markerWhen);
                window.routeMarkers.push(marker);
            }
                // Fit map to route.
                if (validPoints.length === 1) {
                window.gmap.setCenter(validPoints[0].position);
                window.gmap.setZoom(16);
            } else {
                window.gmap.fitBounds(routeBounds);
            }
        }
        // INITIALIZE MAP
        google.maps.event.addDomListener(window,'load', initialize);
    </script>
</head>
<body>
    <div id="gmap"></div>
</body>
</html>
